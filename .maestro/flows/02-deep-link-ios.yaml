appId: ${APP_ID}
name: Native deep link routing on iOS
tags:
  - deep-link
  - ios
  - mobile
---
- extendedWaitUntil:
    visible: Open
    timeout: 10000
- tapOn: "^Open$"
- extendedWaitUntil:
    visible: Capture Run
    timeout: 10000
- scrollUntilVisible:
    element:
      text: Start recording
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: Start recording
    enabled: true
- tapOn: "^Feed$"
- extendedWaitUntil:
    visible: Activity Feed
    timeout: 10000
- tapOn: "^Record$"
- extendedWaitUntil:
    visible: Capture Run
    timeout: 10000
- takeScreenshot: deep-link

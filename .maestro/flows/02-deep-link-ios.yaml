appId: ${APP_ID}
name: Native deep link routing on iOS
tags:
  - deep-link
  - ios
  - mobile
---
- extendedWaitUntil:
    visible: Open
    timeout: 30000
- tapOn: "^Open$"
- extendedWaitUntil:
    visible: Close a loop and the ground inside it is yours
    timeout: 30000
- assertNotVisible: "would like to use your current location"
- scrollUntilVisible:
    element:
      text: Start recording
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    text: Start recording
    enabled: true
- tapOn: "^Feed$"
- extendedWaitUntil:
    visible: Activity Feed
    timeout: 30000
- tapOn: "^Record$"
- extendedWaitUntil:
    visible: Close a loop and the ground inside it is yours
    timeout: 30000
- extendedWaitUntil:
    visible: Cascade Ridge Zone
    timeout: 30000
- takeScreenshot: deep-link

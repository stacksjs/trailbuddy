appId: ${APP_ID}
name: Native deep link routing on iOS
tags:
  - deep-link
  - ios
  - mobile
---
- extendedWaitUntil:
    visible: Open
    timeout: 10000
- tapOn: "^Open$"
- extendedWaitUntil:
    visible: Capture Run
    timeout: 10000
- scrollUntilVisible:
    element:
      text: Start recording
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: Start recording
    enabled: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: deep-link-controls
- scrollUntilVisible:
    element:
      text: Capture Run
    direction: UP
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: Capture Run
- takeScreenshot: deep-link

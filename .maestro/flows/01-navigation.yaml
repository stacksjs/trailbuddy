appId: ${APP_ID}
name: Native shell navigation
tags:
  - mobile
  - smoke
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Find your line.*"
    timeout: 15000
- takeScreenshot: home
- tapOn: "^Feed$"
- extendedWaitUntil:
    visible: Activity Feed
    timeout: 10000
- takeScreenshot: feed
- tapOn: "^Trails$"
- extendedWaitUntil:
    visible: Every trail we know
    timeout: 10000
- takeScreenshot: trails
- tapOn: "^Record$"
- extendedWaitUntil:
    visible: Capture Run
    timeout: 10000
- assertNotVisible: "would like to use your current location"
- scrollUntilVisible:
    element:
      text: Start recording
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: Start recording
    enabled: true
- takeScreenshot: record
- tapOn: "^Territory$"
- extendedWaitUntil:
    visible: Your territory map
    timeout: 10000
- takeScreenshot: territory
- tapOn: "^Profile$"
- extendedWaitUntil:
    visible: Activities
    timeout: 10000
- takeScreenshot: profile
- tapOn: "^Settings$"
- extendedWaitUntil:
    visible: Welcome Back
    timeout: 10000
- takeScreenshot: sign-in

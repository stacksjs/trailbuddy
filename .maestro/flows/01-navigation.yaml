appId: ${APP_ID}
name: Native shell navigation
tags:
  - mobile
  - smoke
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Find your line.*"
    timeout: 15000
- takeScreenshot: home
- tapOn: "^Feed$"
- assertVisible: Activity Feed
- takeScreenshot: feed
- tapOn: "^Trails$"
- assertVisible: Every trail we know
- takeScreenshot: trails
- tapOn: "^Record$"
- assertVisible: Capture Run
- scrollUntilVisible:
    element:
      text: Start recording
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: Start recording
    enabled: true
- takeScreenshot: record
- tapOn: "^Territory$"
- assertVisible: Your territory map
- takeScreenshot: territory
- tapOn: "^Profile$"
- assertVisible: Activities
- takeScreenshot: profile
- tapOn: "^Settings$"
- assertVisible: Welcome Back
- takeScreenshot: sign-in

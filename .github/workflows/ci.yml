name: CI

on:
  push:
    branches:
      - main # deploys to prod

    tags:
      - '*-beta.*' # ensures it is deployed to stage in case `main`` is not pushed to

  pull_request:
    branches:
      - main # deploys to dev

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The lockfile is written by a canary Bun (lockfileVersion 2); stable
          # 1.3.14 cannot read it and silently resolves fresh instead, which
          # is how a deploy ended up installing a half-published dependency
          # set. Pin the runner to the Bun that wrote the lockfile.
          bun-version: canary

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx --bun pickier .

  typecheck:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The lockfile is written by a canary Bun (lockfileVersion 2); stable
          # 1.3.14 cannot read it and silently resolves fresh instead, which
          # is how a deploy ended up installing a half-published dependency
          # set. Pin the runner to the Bun that wrote the lockfile.
          bun-version: canary

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun buddy test:types

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379

      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306

      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The lockfile is written by a canary Bun (lockfileVersion 2); stable
          # 1.3.14 cannot read it and silently resolves fresh instead, which
          # is how a deploy ended up installing a half-published dependency
          # set. Pin the runner to the Bun that wrote the lockfile.
          bun-version: canary

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Test Suite
        env:
          AWS_DYNAMODB_ENDPOINT: http://localhost:8000
        run: bun test

  release-check:
    runs-on: ubuntu-latest

    outputs:
      contains_release: ${{ steps.check_release.outputs.contains_release }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Release Check
        id: check_release
        # Two fixes here.
        #
        # `$GITHUB_ENV` only takes effect in LATER steps, so the previous
        # version wrote CONTAINS_RELEASE and then read `env.CONTAINS_RELEASE`
        # in the same step, where it was always empty. The output was
        # therefore always '' — never '0' — which is half of why the deploy
        # below never ran. It writes the output directly now.
        #
        # And it reads the SUBJECT (%s), not the whole body (%B). A release
        # commit announces itself in its subject: `chore: release v1.2.3`.
        # Grepping the body caught any commit that so much as mentioned the
        # word — including the one that fixed this deploy pipeline, whose body
        # explains what ships in a release. That silently skipped the deploy.
        run: |
          subject=$(git log --format=%s -n 1 HEAD)
          count=$(printf '%s' "$subject" | grep -ci 'release' || true)
          echo "subject: ${subject}"
          echo "contains_release=${count}" >> "$GITHUB_OUTPUT"

  deploy-prod:
    # Was gated on `needs.check_commit_message.outputs.contains_release`.
    # There is no `check_commit_message` job — the job is `release-check` — and
    # it was not in `needs` either, so the expression evaluated to null, the
    # `== '0'` comparison was always false, and production has never once been
    # deployed by this workflow.
    # Bracket notation is required: `needs.release-check` would parse the
    # hyphen as subtraction.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs['release-check'].outputs.contains_release == '0'
    needs: [lint, typecheck, test, release-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The lockfile is written by a canary Bun (lockfileVersion 2); stable
          # 1.3.14 cannot read it and silently resolves fresh instead, which
          # is how a deploy ended up installing a half-published dependency
          # set. Pin the runner to the Bun that wrote the lockfile.
          bun-version: canary

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Deploy SSH Key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "No deploy SSH key configured; continuing without one."
            exit 0
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          chmod 644 ~/.ssh/id_ed25519.pub

      - name: Deploy production
        run: ./buddy deploy --prod --yes
        env:
          APP_ENV: production
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPYFILE_DISABLE: '1'

  deploy-stage:
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-beta.'))
    needs: [lint, typecheck, test, deploy-prod, deploy-dev]
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The lockfile is written by a canary Bun (lockfileVersion 2); stable
          # 1.3.14 cannot read it and silently resolves fresh instead, which
          # is how a deploy ended up installing a half-published dependency
          # set. Pin the runner to the Bun that wrote the lockfile.
          bun-version: canary

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

  deploy-dev:
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'pull_request' && github.base_ref == 'main')
    needs: [lint, typecheck, test, deploy-prod]
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The lockfile is written by a canary Bun (lockfileVersion 2); stable
          # 1.3.14 cannot read it and silently resolves fresh instead, which
          # is how a deploy ended up installing a half-published dependency
          # set. Pin the runner to the Bun that wrote the lockfile.
          bun-version: canary

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

  publish-commit:
    runs-on: ubuntu-latest
    env:
      STX_REVISION: cc0604b4e8bd5ff22ffbeaedf2c108fdd277bbb2

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The lockfile is written by a canary Bun (lockfileVersion 2); stable
          # 1.3.14 cannot read it and silently resolves fresh instead, which
          # is how a deploy ended up installing a half-published dependency
          # set. Pin the runner to the Bun that wrote the lockfile.
          bun-version: canary

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Checkout STX
        uses: actions/checkout@v6
        with:
          repository: stacksjs/stx
          ref: ${{ env.STX_REVISION }}
          path: .stx-source

      - name: Build
        env:
          STX_SOURCE_ROOT: ${{ github.workspace }}/.stx-source
        run: bun run build

      # Commit builds go to the pantry registry, which is where this project
      # gets its dependencies and which ships `publish:commit` for exactly
      # this. The third-party service used here before refused the repo
      # outright — it skips private packages, and wildloop is
      # `"private": true` because it is an application rather than a library,
      # so it answered `400 {"message":"No packages"}` on every run.
      #
      # The installer action lives inside the pantry monorepo (packages/action)
      # and is not published as `pantry-pm/pantry-installer` yet, so the
      # release binary is fetched directly. Swap this step for the action once
      # that repo exists.
      - name: Install Pantry
        run: |
          tmp=$(mktemp -d)
          curl -fsSL -o "$tmp/pantry.zip" \
            https://github.com/pantry-pm/pantry/releases/latest/download/pantry-linux-x64.zip
          # The archive holds a bare `pantry` binary, no wrapping directory.
          unzip -oq "$tmp/pantry.zip" -d "$tmp"
          sudo install -m 755 "$tmp/pantry" /usr/local/bin/pantry
          rm -rf "$tmp"
          pantry --version

      # `publish:commit` derives the version from the commit SHA itself, so
      # each build is separately installable without anyone stamping
      # package.json.
      #
      # A credential problem does not fail this job. That was already the rule
      # for a MISSING token — "a permanently red job teaches everyone to ignore
      # CI" — but the guard only covered absence, and the token configured here
      # is present and rejected. So the job failed on every commit, and because
      # Deploy is gated on CI's conclusion, an expired registry credential was
      # quietly blocking every deployment of the application.
      #
      # Publishing a commit build is not a correctness gate for the app: it is
      # a convenience for installing a specific SHA. It reports loudly and
      # moves on, so what gates a deploy stays limited to whether the code is
      # good.
      - name: Publish Commit
        env:
          PANTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
        run: |
          if [ -z "${PANTRY_TOKEN}" ]; then
            echo "PANTRY_TOKEN is not set — skipping the commit publish."
            echo "Add it to the repository secrets to publish this commit to the pantry registry."
            pantry publish:commit --dry-run --compact
            exit 0
          fi
          if ! pantry publish:commit --compact; then
            echo "::warning title=Commit publish failed::pantry publish:commit failed with the configured PANTRY_TOKEN. This commit is not installable from the registry; the build itself is unaffected. Rotate the token in repository secrets."
            exit 0
          fi

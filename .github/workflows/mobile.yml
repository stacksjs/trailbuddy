name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'config/mobile.ts'
      - 'resources/**'
      - 'storage/framework/core/mobile/**'
      - 'storage/framework/core/actions/src/build/ios*.ts'
      - 'storage/framework/core/actions/src/build/android*.ts'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'config/mobile.ts'
      - 'resources/**'
      - 'storage/framework/core/mobile/**'
      - 'storage/framework/core/actions/src/build/ios*.ts'
      - 'storage/framework/core/actions/src/build/android*.ts'
      - '.github/workflows/mobile.yml'

jobs:
  source-projects:
    env:
      ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
    strategy:
      matrix:
        include:
          - platform: ios
            os: macos-latest
          - platform: android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.platform == 'android'
      - name: Install XcodeGen
        if: matrix.platform == 'ios'
        run: brew install xcodegen
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build shared STX application
        run: bun run build
      - name: Checkout Craft
        uses: actions/checkout@v4
        with:
          repository: home-lang/craft
          path: .craft
      - name: Configure Firebase
        if: matrix.platform == 'android' && env.ANDROID_GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ env.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p .mobile-secrets
          printf '%s' "$GOOGLE_SERVICES_JSON" > .mobile-secrets/google-services.json
          echo "ANDROID_GOOGLE_SERVICES_FILE=$PWD/.mobile-secrets/google-services.json" >> "$GITHUB_ENV"
      - name: Generate iOS project
        if: matrix.platform == 'ios'
        run: CRAFT_IOS_SRC="$PWD/.craft/packages/ios/src/index.ts" bun run build:ios
      - name: Parse generated Swift
        if: matrix.platform == 'ios'
        run: find storage/framework/mobile/ios -name '*.swift' -print0 | xargs -0 swiftc -frontend -parse
      - name: Compile iOS simulator app
        if: matrix.platform == 'ios'
        run: xcodebuild -project storage/framework/mobile/ios/WildLoop.xcodeproj -scheme WildLoop -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Generate Android project
        if: matrix.platform == 'android'
        run: CRAFT_ANDROID_SRC="$PWD/.craft/packages/android/src/index.ts" bun run build:android
      - name: Verify provenance
        run: bun -e "JSON.parse(await Bun.file('storage/framework/mobile/${{ matrix.platform }}/stacks-mobile.json').text())"
